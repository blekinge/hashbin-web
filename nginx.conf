server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness/readiness endpoint for the web pod.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Static assets: short cache. (No content-hashed filenames in this app.)
    location ~* \.(js|css|svg|png|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Real URLs are actual files (index.html, verify.html, ...) — multi-page, so no
    # SPA fallback is required.
    location / {
        try_files $uri $uri/ =404;
    }
}
